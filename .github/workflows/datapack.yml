name: datapack
on:
  schedule:
    - cron: "41 9 * * 1-5"    # 平日18:41(日本時間)。GitHubの定時実行は数分〜十数分遅れることがある
    - cron: "11 10 * * 1-5"   # 予備：19:11
  workflow_dispatch:           # 手動実行ボタン
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python datapack.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "datapack $(date +%F)" || echo "no change"
          git pull --rebase
          git push
